<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperOne | Be on the Business Side</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #f5ebd0;
    line-height: 1.6;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }
  .cover-image {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
    display: block;
  }
  .logo {
    display: block;
    width: 64px;
    height: auto;
    margin: 0 auto 12px;
  }
  h1 {
    color: #E8A317;
    font-size: 32px;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #f5ebd0;
    font-size: 15px;
    margin-bottom: 24px;
  }
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 28px;
    background: #111;
  }
  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 12px;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .btn {
    display: block;
    text-align: center;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: #E8A317;
    color: #000;
  }
  .btn-secondary {
    background: transparent;
    color: #E8A317;
    border: 2px solid #E8A317;
  }
  .footer {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 32px;
  }
</style>
</head>
<body>
  <div class="container">
    <img src="https://drive.google.com/uc?export=view&id=1NLLHeaogfnUBYMEuFiCZewJkZBiHkuQC" alt="SuperOne" class="cover-image">
    <img src="https://drive.google.com/uc?export=view&id=1_QOkAYIoh6OEyfpcFTSKY8ipA83Ry0oU" alt="SuperOne Logo" class="logo">
    <h1>SuperOne</h1>
    <p class="subtitle">Be on the business side of the game. Creators earn in real time from fan engagement.</p>
    <div class="video-wrapper">
      <iframe 
        src="https://drive.google.com/file/d/1fwQMohLL-fD164j6oPRusbA5KIyx9hRz/preview" 
        allow="autoplay" 
        allowfullscreen>
      </iframe>
    </div>
    <div class="buttons">
      <a href="https://super.one/YT7nuQczPR+1" class="btn btn-primary">Get Started in the App</a>
      <a href="https://www.skool.com/the-passive-income-lab-7776/about" class="btn btn-secondary">Learn More in Skool</a>
    </div>
    <div class="footer">
      SuperOne is a football fan engagement platform. Creators sit on the business side.
    </div>
  </div>
</body>
</html>
