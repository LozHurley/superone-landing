<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperOne | The Business That Runs on Fans</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }
  @media (min-width: 768px) {
    .wrap { max-width: 640px; }
  }
  .inner {
    padding: 20px 16px 40px;
  }
  .logo {
    width: 48px;
    display: block;
    margin: 0 auto 14px;
  }
  h1 {
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    line-height: 1.05;
    margin-bottom: 12px;
  }
  @media (min-width: 768px) {
    h1 { font-size: 40px; }
  }
  h1 span { color: #D4FF00; }
  .lead {
    text-align: center;
    font-size: 16px;
    color: #eee;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .video-box {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    margin-bottom: 24px;
    border-radius: 14px;
    overflow: hidden;
    background: #111;
    cursor: pointer;
  }
  .video-box img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68px;
    height: 68px;
    background: rgba(0,0,0,0.55);
    border: 3px solid #D4FF00;
    border-radius: 50%;
  }
  .play::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 54%;
    transform: translate(-50%, -50%);
    border-left: 20px solid #D4FF00;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
  }
  .video-box iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }
  .cta {
    display: block;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 17px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .cta-main { background: #D4FF00; color: #000; }
  .cta-alt { background: transparent; color: #D4FF00; border: 2px solid #D4FF00; }
  .note {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="inner">
      <img src="logo.jpg" alt="" class="logo">

      <h1>THE BUSINESS THAT<br>RUNS ON <span>FANS</span></h1>
      <p class="lead">Creators sit on the business side of SuperOne. Fans play. You earn.</p>

      <div class="video-box" id="videoBox" onclick="play()">
        <img src="Superone%20Cover.png" alt="SuperOne">
        <div class="play"></div>
        <iframe id="vid" allow="autoplay" allowfullscreen></iframe>
      </div>

      <a href="https://super.one/YT7nuQczPR+1" class="cta cta-main">Start in the App</a>
      <a href="https://www.skool.com/the-passive-income-lab-7776/about" class="cta cta-alt">See How Creators Earn</a>

      <p class="note">Football first. Then other sports. Launching with ByteDance.</p>
    </div>
  </div>

  <script>
    function play() {
      const box = document.getElementById('videoBox');
      const img = box.querySelector('img');
      const playBtn = box.querySelector('.play');
      const iframe = document.getElementById('vid');
      img.style.display = 'none';
      playBtn.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = 'https://drive.google.com/file/d/1fwQMohLL-fD164j6oPRusbA5KIyx9hRz/preview';
    }
  </script>
</body>
</html>
